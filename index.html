:root{color-scheme:dark;--ink:#06122a;--panel:rgba(10,26,52,.66);--line:rgba(190,222,255,.2);--snow:#f4f9ff;--ice:#bfe4ff;--blue:#2f7cff;--blue2:#58c1ff;--mint:#4de8c0;--gold:#ffd24a;--muted:#9bb6d4;

 transition:transform .08s,background .12s,box-shadow .12s;-webkit-tap-highlight-color:transparent}

.hdr .coins{flex:none}
.inp{width:100%;box-sizing:border-box;font:700 16px var(--body);color:var(--snow);padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.07);outline:none;-webkit-user-select:text;user-select:text}
textarea.inp{resize:none;font-size:13px}
.inp:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(88,193,255,.2)}
.two{display:grid;grid-template-columns:minmax(230px,.8fr) 1.4fr;gap:18px;align-items:start}
.two .stk{position:sticky;top:56px;display:flex;flex-direction:column;gap:12px}
.two .stk canvas{width:100%;aspect-ratio:1/1;max-height:340px;border-radius:18px;background:linear-gradient(180deg,rgba(88,193,255,.16),rgba(88,193,255,.03))}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.chs .opt{padding:8px;gap:6px;align-items:center;text-align:center}
.chs .opt .nm{font-size:12px}
.cnt{font:500 10px var(--display);letter-spacing:.14em;color:var(--muted)}
.opt.off{opacity:.45;filter:saturate(.35)}
.opt.off canvas{filter:brightness(.7)}
.mini-st{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:13px;color:var(--muted)}
.mini-st b{color:var(--snow);font-weight:800}
@media (max-width:700px){.two{grid-template-columns:1fr}.two .stk{position:relative;top:0}.two .stk canvas{max-height:220px}}

const ROCKV=[{w:1,h:.85},{w:1.3,h:.5},{w:.62,h:1.5},{w:.95,h:.95},{w:1.15,h:.7}];
const SEGM={rollers:1.04,cruise:1,jumps:.95,moguls:1.05,steep:1.7,flat:.18,rails:.9,drop:1,bigjump:.92};
function buildTrack(def,free){
 const rnd=rng(def.seed*7+(free?3:0)),sky=!!def.skydrop,reps=(free&&!sky)?2:1;
 const len=def.len*reps,N=Math.ceil(len+140),L=Math.ceil(def.limit+6),GW=2*L+1;
 /* lejtő-profil szakaszokból */
 const segs=[];
 const z0s=sky?700:60,zEnd=sky?def.len:def.len;
 let zc=z0s;
 const sumR=def.recipe.reduce((a,b)=>a+b[1],0);
 for(let k=0;k<reps;k++)for(const [t,l] of def.recipe){const ll=l/sumR*((sky?def.len:def.len)-z0s);segs.push({t,z0:zc,z1:zc+ll});zc+=ll;}
 const slope=new Float32Array(N+2);
 if(sky){
  const yf=x=>-.2*x*(1-sstep(x/40))-.003*x*x-60*sstep(x/25)*(1-sstep(x/320));
  const s340=yf(339)-yf(340);
  for(let i=0;i<N+2;i++){
   if(i<300)slope[i]=.2;
   else{const x=i-300;
    if(x<340)slope[i]=yf(x)-yf(x+1);
    else if(x<340+320)slope[i]=lerp(s340,.28,sstep((x-340)/320));
    else slope[i]=def.m0*1.1;}
  }
  for(const s of segs)for(let i=Math.floor(s.z0);i<s.z1&&i<N+2;i++)slope[i]=def.m0*SEGM[s.t];
 }else{
  for(let i=0;i<N+2;i++){
   let m=def.m0*.5;
   if(i>=60){m=def.m0;for(const s of segs)if(i>=s.z0&&i<s.z1){m=def.m0*SEGM[s.t];break;} if(i>=zc)m=def.m0*.5;}
   slope[i]=m;
  }
 }
 const sm=new Float32Array(N+2);
 for(let i=0;i<N+2;i++){let a=0,c=0;for(let j=-16;j<=16;j++){const k=Math.min(N+1,Math.max(0,i+j));a+=slope[k];c++;}sm[i]=a/c;}
 const base=new Float32Array(N+2),p1=rnd()*TAU,p2=rnd()*TAU,p3=rnd()*TAU;
 const roll=def.kind==='street'?.1:def.powder?.3:.26;
 let y=0;for(let i=0;i<N+2;i++){base[i]=y;y-=(sky&&i>=270&&i<700)?slope[i]:sm[i]*(sky?1:1.14);}
 /* lépcsők (drop) */
 if(!sky)for(const s of segs)if(s.t==='drop'){const zc2=(s.z0+s.z1)/2,D=5+rnd()*6;for(let i=Math.floor(zc2-8);i<N+2;i++)base[i]-=D*sstep((i-zc2)/7);}
 for(let i=0;i<N+2;i++)base[i]+=(sky&&i>=270&&i<700)?0:roll*(Math.sin(i/31+p1)*.65+Math.sin(i/13+p2)*.35);
 /* rács */
 const grid=new Float32Array(N*GW);
 const hw=def.halfW,berm=(def.kind==='street'||def.powder)?0:2.6;
 for(let i=0;i<N;i++)for(let xi=0;xi<GW;xi++){
  const ax=Math.abs(xi-L);let b=0;
  if(ax>hw)b=berm*sstep((ax-hw)/9);
  if(def.powder)b+=1.0*Math.sin(i/37+xi*.09+p1)*Math.sin(i/23-xi*.07+p2)+.55*Math.sin(i/61+xi*.05+p3)+.25*Math.sin(i/11+xi*.21);
  else if(def.kind==='offtrack')b+=.9*Math.sin(xi*.35+i*.05)*Math.sin(i*.11+xi*.12);
  if(def.kind!=='street')b+=(def.powder?2.4:1.4)*(Math.sin(i/17+xi*.045+p1)*.6+Math.sin(i/29-xi*.06+p2)*.4)*(.55+.45*Math.sin(i/90+p3));
  grid[i*GW+xi]=base[i]+b;
 }
 const addBump=(cz,cx,r,h)=>{
  const R=Math.ceil(r*2.4);
  for(let dz=-R;dz<=R;dz++){const zi=Math.round(cz)+dz;if(zi<0||zi>=N)continue;
   for(let dx=-R;dx<=R;dx++){const xi=Math.round(cx)+L+dx;if(xi<0||xi>=GW)continue;
    const d2=(dz*dz+dx*dx)/(r*r);if(d2>5.8)continue;grid[zi*GW+xi]+=h*Math.exp(-d2*1.1);}}
 };
 const kickers=[],rails=[],objs=[];
 const kz=(zl,k)=>{
  const {h,Lr,Lt}=k;
  if(zl<-Lr)return 0;
  if(zl<0)return h*Math.pow((zl+Lr)/Lr,1.6);
  if(zl<Lt)return h;
  const G=7+h;
  if(zl<Lt+G)return lerp(h,-h*.55,sstep((zl-Lt)/G));
  if(zl<Lt+G+26)return lerp(-h*.55,0,sstep((zl-Lt-G)/26));
  return 0;
 };
 const addKicker=(k)=>{
  const z0=Math.floor(k.z-k.Lr-2),z1=Math.ceil(k.z+k.Lt+k.h+50);
  for(let zi=Math.max(0,z0);zi<=Math.min(N-1,z1);zi++){
   const v=kz(zi-k.z,k);if(v===0)continue;
   for(let xi=0;xi<GW;xi++){const x=xi-L;const w=sstep((x-k.x0)/1.8)*sstep((k.x1-x)/1.8);if(w>0)grid[zi*GW+xi]+=v*w;}
  }
  kickers.push(k);
 };
 if(sky)addKicker({z:296,x0:-14,x1:14,h:2.4,Lr:16,Lt:0});
 const big=(def.id==='summit'||def.id==='steep'||def.id==='golden'||def.id==='avalanche')?1.25:1,hs=def.m0>.24?1.1:1;
 for(const s of segs){
  const sl=s.z1-s.z0;
  if(s.t==='jumps'){
   let z=s.z0+22+rnd()*8;
   while(z<s.z1-40){
    const full=rnd()<.3,wd=full?hw*1.7:8+rnd()*8,cx=full?0:(rnd()*2-1)*Math.max(0,hw-wd/2-1);
    const mega=rnd()<.2?1.7:1;
    const h=(1.4+rnd()*1.7)*big*hs*mega*(def.kind==='street'?.7:1),tab=rnd()<.35;
    addKicker({z:z+8,x0:cx-wd/2,x1:cx+wd/2,h,Lr:7+h*1.8,Lt:tab?7+rnd()*4:0});
    z+=50+rnd()*24+h*3;
   }
  }else if(s.t==='bigjump'){
   const wd=hw*(1.2+rnd()*.5),h=(5.5+rnd()*2.5)*(big>1?1.1:1);
   addKicker({z:s.z0+sl*.45,x0:-wd/2,x1:wd/2,h,Lr:26+h*1.4,Lt:9+rnd()*5});
  }else if(s.t==='moguls'){
   const n=Math.floor(sl*hw*2*.0125*(def.mog/.18));
   for(let i=0;i<n;i++)addBump(s.z0+rnd()*sl,(rnd()*2-1)*(hw+3),1.7+rnd()*1.4,(.45+rnd()*.6)*(def.mog/.18));
  }else if(s.t==='rollers'){
   const wl=15+rnd()*6,am=(.7+rnd()*.7)*(def.m0>.24?1.2:1),ph=rnd()*TAU;
   for(let zi=Math.max(0,Math.floor(s.z0));zi<=Math.min(N-1,Math.ceil(s.z1));zi++){
    const e=sstep((zi-s.z0)/14)*sstep((s.z1-zi)/14),v=am*e*(Math.sin((zi-s.z0)/wl*TAU+ph)*.5+.5);
    for(let xi=0;xi<GW;xi++){const ax=Math.abs(xi-L);const wt=1-sstep((ax-hw-2)/6);if(wt>0)grid[zi*GW+xi]+=v*wt;}
   }
  }else if(s.t==='rails'){
   let z=s.z0+20+rnd()*6;
   while(z<s.z1-24){
    const box=rnd()<.4,len2=box?7+rnd()*5:14+rnd()*8,x=(rnd()*2-1)*(hw-3);
    rails.push({x,z0:z,z1:z+len2,w:box?1.1:.55,h:box?.6:.95,box});
    z+=34+rnd()*14;
   }
  }
 }
 /* objektumok */
 const nearKick=(z,x)=>kickers.some(k=>z>k.z-k.Lr-6&&z<k.z+k.Lt+k.h+40&&x>k.x0-3&&x<k.x1+3);
 const nearRail=(z,x)=>rails.some(r=>z>r.z0-8&&z<r.z1+8&&Math.abs(x-r.x)<5);
 const denT=def.trees,beach=def.kind==='beach';
 const cliffZ=(z)=>sky&&z>285&&z<700;
 const vmix={forest:[3,2,2,1,1,0,4],powder:[3,1,0,0,1,2],steep:[0,0,3,3,2],glacier:[0,0,3,2],piste:[0,0,0,2,1,2,4],beach:[0],street:[0],skydrop:[0,0,2]}[def.kind]||[0,0,1,2];
 const mkTree=(x,z,o)=>{const q=rnd(),v=vmix[Math.floor(rnd()*vmix.length)];objs.push(Object.assign({t:beach?'palm':'tree',x,z,s:beach?.8+rnd()*.7:(.5+Math.pow(q,1.7)*2.1),k:rnd()<.5?0:1,v,r:.9,sd:Math.floor(rnd()*1000)},o||{}));};
 if(def.kind==='street'){
  for(let z=40;z<len+60;z+=26+rnd()*8){
   for(const sd of [-1,1]){objs.push({t:'bld',x:sd*(hw+8+rnd()*3),z,w:9+rnd()*5,h:11+rnd()*16,c:Math.floor(rnd()*4),sd});}
  }
  for(let z=50;z<len+40;z+=30){for(const sd of [-1,1])objs.push({t:'lamp',x:sd*(hw+1),z});}
 }else{
  if(denT>0)for(let z=24;z<len+60;z+=7/Math.max(.2,denT)){
   if(cliffZ(z))continue;
   const sd=rnd()<.5?-1:1;
   mkTree(sd*(hw+1.5+rnd()*(def.limit-hw+4)),z+rnd()*6);
  }
  const inside=def.kind==='forest'?.9:def.powder?(def.id==='backcountry'?.9:.35):def.kind==='steep'?.25:beach?.12:.08;
  if(denT>0)for(let z=60;z<len+40;z+=9/Math.max(.1,inside*denT+.15)){
   if(cliffZ(z))continue;
   const x=(rnd()*2-1)*(hw-1);
   if(nearKick(z,x)||nearRail(z,x))continue;
   if(rnd()<(def.kind==='steep'?.15:.55))mkTree(x,z);
  }
  if(def.rocks>0)for(let z=50;z<len+40;z+=14/def.rocks){
   if(cliffZ(z))continue;
   const x=(rnd()*2-1)*(def.limit-1);

function xformPrims(prims,R,pivot,pos){
 const T=p=>{const q=R(vsub(p,pivot));return [pos[0]+pivot[0]+q[0],pos[1]+pivot[1]+q[1],pos[2]+pivot[2]+q[2]];};
 const Rv2=v=>R(v);
 return prims.map(p=>{
  const o=Object.assign({},p);
  if(p.t==='s')o.c=T(p.c);
  else if(p.t==='c'||p.t==='k'){o.a=T(p.a);o.b=T(p.b);}
  else if(p.t==='b'){o.c=T(p.c);o.ax=p.ax.map(Rv2);}
  else if(p.t==='m'){o.c=T(p.c);o.faces=p.faces.map(f=>({p:f.p.map(T),col:f.col}));}
  return o;
 });
}

}

const TREW=[null,{rp:10,coin:90},{rp:26,coin:230},{rp:60,coin:520}];
function pickTask(g){
 const done=g.tasksDone||0;
 const tier=done<2?1:done<5?(Math.random()<.6?1:2):done<9?(Math.random()<.3?1:Math.random()<.75?2:3):(Math.random()<.15?1:Math.random()<.5?2:3);
 let pool=TASKDEFS.filter(d=>d.tier===tier&&(!d.ok||d.ok(g.T))&&d.id!==g.lastTask);
 if(!pool.length)pool=TASKDEFS.filter(d=>d.tier===1);
 const d=pool[Math.floor(Math.random()*pool.length)];
 g.lastTask=d.id;
 const bonus=1+Math.min(1,rankOf(S.save.rp)*.04);
 g.task={d,prog:0,goal:d.goal,tl:d.tier===1?75:d.tier===2?95:120,
  rp:Math.round(TREW[d.tier].rp*bonus*(g.dm||1)),coin:Math.round(TREW[d.tier].coin*bonus*(g.dm||1))};
 g.taskFlash=1;
 taskHud(g);
}
function taskHud(g){
 const e=E.task;if(!e)return;
 const t=g.task;if(!t){e.hidden=true;return;}
 e.hidden=false;
 e.querySelector('.tt').textContent=t.d.txt;
 const pct=t.goal>1?clamp(t.prog/t.goal,0,1)*100:0;
 e.querySelector('.tb i').style.width=pct+'%';
 e.querySelector('.tr').textContent='+'+t.rp+' RP  ·  +$'+t.coin;
 e.querySelector('.tc').textContent=Math.ceil(Math.max(0,t.tl))+'s';
 e.classList.toggle('flash',g.taskFlash>0);
}
function taskDone(g){
 const t=g.task;if(!t)return;
 g.tasksDone=(g.tasksDone||0)+1;g.taskRP=(g.taskRP||0)+t.rp;g.taskCoin=(g.taskCoin||0)+t.coin;
 const ru=award(t.rp,t.coin);
 if(ru){g.rankUp=g.rankUp?{old:g.rankUp.old,nw:ru.nw,bonus:g.rankUp.bonus+ru.bonus}:ru;}
 popup('Task complete','+'+t.rp+' RP  +$'+t.coin,false,true);confetti(g,50);g.flash=.6;
 g.task=null;g.nextTask=1.6;taskHud(g);
 if(ru)setTimeout(()=>popup('RANK UP','You are now '+RANKS[ru.nw].n,false,true),1500);
}
function taskAdd(g,on,v){
 const t=g.task;if(!t||t.d.on!==on)return;
 const d=t.d;
 if(on==='chain'){t.prog=Math.max(t.prog,d.f(v));}
 else t.prog+=on==='tick'?d.f(g,v):d.f(v);
 if(t.prog>=t.goal-1e-6)taskDone(g);else if(on!=='tick')taskHud(g);
}
function taskTick(g,dt){
 if(g.state!=='run')return;
 if(g.taskFlash>0)g.taskFlash-=dt;
 if(!g.task){g.nextTask-=dt;if(g.nextTask<=0)pickTask(g);return;}
 const t=g.task;
 t.tl-=dt;
 if(t.d.on==='tick')taskAdd(g,'tick',dt);
 g._th=(g._th||0)+dt;
 if(t.tl<=0){popup('Task failed','A new task is coming',true);g.task=null;g.nextTask=1.4;taskHud(g);return;}
 if(g._th>.15){g._th=0;taskHud(g);}
}
function taskSkip(g){
 if(!g||g.mode!=='task'||!g.task||g.state!=='run')return;

  const sv=S.save,cat=S.lk||'char',ri=rankOf(sv.rp),ch=charOf(sv.eq.char);
  const tabs=[['char','Rider'],['board','Boards'],['costume','Costumes'],['goggles','Goggles'],['helmet','Helmets'],['track','Mountains']];
  let body='';
  if(cat==='char'){
   body=`<h3>Your name</h3><input class="inp" id="nameIn2" maxlength="14" autocomplete="off" spellcheck="false" value="${esc(sv.name)}">
   <h3>Your riders</h3><div class="chs">${CHARS.map(c=>{const ow=sv.own.char.includes(c.id);return `<button class="card opt${ow?'':' off'}${c.id===sv.eq.char?' sel':''}" ${ow?`data-a="eq2" data-c="char" data-v="${c.id}"`:'style="cursor:default"'}><canvas class="pv sq" data-k="char" data-id="${c.id}" width="200" height="200"></canvas><span class="nm">${c.n}</span><span class="ds" style="font-size:11px">${ow?c.tr:(ri<c.rank?'Locked · '+RANKS[c.rank].n:'In shop · $'+fmt(c.price))}</span></button>`;}).join('')}</div>`;
  }else{
   const all=cat==='track'?TRACKS:ITEMS[cat];
   const owned=it=>cat==='track'?(!it.price||sv.own.track.includes(it.id)):sv.own[cat].includes(it.id);
   const nofit=it=>cat==='helmet'&&!fits(ch,it);
   const n=all.filter(owned).length;
   body=`<div class="cnt">COLLECTION ${n} / ${all.length}</div><div class="grid">${all.map(it=>{
    const ow=owned(it),eq=cat!=='track'&&sv.eq[cat]===it.id;
    const top=`<canvas class="pv${cat==='track'?'':' sq'}" data-k="${cat}" data-id="${it.id}" width="${cat==='track'?320:260}" height="${cat==='track'?200:260}"></canvas>`;
    let st;
    if(eq)st='<span class="pill ok">EQUIPPED</span>';
    else if(cat==='track')st=ow?'<span class="pill ok">UNLOCKED</span>':'<span class="pill">'+(ri<it.rank?'LOCKED · '+RANKS[it.rank].n:'IN SHOP · $'+fmt(it.price))+'</span>';
    else if(ow&&nofit(it))st='<span class="pill">DOES NOT FIT '+ch.n.toUpperCase()+'</span>';
    else if(ow)st='<span class="pill">TAP TO EQUIP</span>';
    else st='<span class="pill">'+(ri<it.rank?'LOCKED · '+RANKS[it.rank].n:'IN SHOP · $'+fmt(it.price))+'</span>';
    return `<button class="card opt${ow&&!nofit(it)?'':' off'}${eq?' sel':''}" ${cat!=='track'&&ow&&!nofit(it)?`data-a="eq2" data-c="${cat}" data-v="${it.id}"`:'style="cursor:default"'}>${top}<span class="nm">${it.n}</span>${st}</button>`;}).join('')}</div>`;
  }
  const P=calcP();
  return `<div class="wrap"><div class="hdr"><button class="btn gh c" data-a="go" data-v="menu">‹ Back</button><h2>My Rider</h2><div class="coins">$ ${fmt(sv.coins)}</div></div>
  <div class="two"><div class="stk"><canvas id="lockPv" width="520" height="520"></canvas>
   <div class="card"><div class="nm" style="font:700 16px var(--display)">${esc(sv.name||'Rider')}</div><div class="muted" style="font-size:13px;margin-bottom:8px">${ch.n} · ${RANKS[ri].n}</div>
   <div class="mini-st"><span>Speed</span><b>x${P.speed.toFixed(2)}</b><span>Rotation</span><b>x${P.air.toFixed(2)}</b><span>Trick score</span><b>x${P.scoreMul.toFixed(2)}</b><span>Nitro refill</span><b>${P.regen}/s</b><span>Speed kept after a fall</span><b>${Math.round(P.keep*100)}%</b></div></div>
   <button class="btn pri c" data-a="go" data-v="shop">Open shop</button></div>
  <div style="display:flex;flex-direction:column;gap:14px"><div class="tabs">${tabs.map(t=>`<button class="tab${t[0]===cat?' sel':''}" data-a="lk" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${body}</div></div></div>`;},
 shop(){
  const sv=S.save,ri=rankOf(sv.rp),cat=S.tab;
  const list=cat==='track'?TRACKS.filter(t=>t.price):ITEMS[cat];
  return `<div class="wrap"><div class="hdr"><button class="btn gh c" data-a="go" data-v="menu">‹ Back</button><h2>Shop</h2><div class="coins">$ ${fmt(sv.coins)}</div></div>
  <div class="tabs">${CATS.map(c=>`<button class="tab${c[0]===cat?' sel':''}" data-a="tab" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
  <div class="grid">${list.map(it=>{
   const own=cat==='track'?sv.own.track.includes(it.id):sv.own[cat].includes(it.id),eq=cat!=='track'&&sv.eq[cat]===it.id,lock=ri<it.rank,cant=!own&&sv.coins<it.price;
   let act;
   if(cat==='track')act=own?'<span class="pill ok">UNLOCKED</span>':lock?`<span class="pill">LOCKED · ${RANKS[it.rank].n}</span>`:`<button class="btn pri c" style="padding:12px" data-a="buy" data-v="${it.id}" ${cant?'disabled':''}>Unlock · $${fmt(it.price)}</button>`;
   else if(cat==='helmet'&&!fits(charOf(sv.eq.char),it))act='<span class="pill">DOES NOT FIT '+charOf(sv.eq.char).n.toUpperCase()+'</span>';
   else if(eq)act='<span class="pill ok">EQUIPPED</span>';
   else if(own)act=`<button class="btn c" style="padding:12px" data-a="equip" data-v="${it.id}">Equip</button>`;
   else if(lock)act=`<span class="pill">LOCKED · ${RANKS[it.rank].n}</span>`;
   else act=`<button class="btn pri c" style="padding:12px" data-a="buy" data-v="${it.id}" ${cant?'disabled':''}>Buy · $${fmt(it.price)}</button>`;
   const top=`<canvas class="pv${cat==='track'?'':' sq'}" data-k="${cat}" data-id="${it.id}" width="${cat==='track'?320:260}" height="${cat==='track'?200:260}"></canvas>`;
   const prem=it.price>=20000?'<span class="pill gold">LEGENDARY</span>':it.price>=6000?'<span class="pill gold">PREMIUM</span>':'';
   const fx=cat==='track'?it.d:itemFx(cat,it);
   return `<div class="card opt" style="cursor:default">${top}<span class="nm">${it.n}</span><span class="ds">${fx}</span>${prem}${act}</div>`;
  }).join('')}</div>
  </div>`;},
 ranks(){
  const sv=S.save,ri=rankOf(sv.rp);
  return `<div class="wrap"><div class="hdr"><button class="btn gh c" data-a="go" data-v="menu">‹ Back</button><h2>Ranks</h2><div class="coins">${fmt(sv.rp)} RP</div></div>
  <div class="muted">Earn RP from races and freestyle tricks. Every new rank pays a cash reward you can spend in the shop. Some mountains and gear need a high rank.</div>
  <div class="rl">${RANKS.map((r,i)=>`<div class="rr${i===ri?' cur':''}${i<ri?' done':''}"><span class="n">${i+1}</span><div><div class="nm">${r.n}</div><div class="sub">${fmt(r.rp)} RP</div></div><div class="sub">${r.coin?'+ $'+fmt(r.coin):'Starting rank'}</div></div>`).join('')}</div>
  </div>`;},
 help(){return `<div class="wrap"><div class="hdr"><button class="btn gh c" data-a="go" data-v="menu">‹ Back</button><h2>How to play</h2><span></span></div>
  <div class="card"><div class="keys">
   <b>STEERING PAD</b><span>Drag the knob left or right to carve across the slope. In the air you drift sideways.</span>
   <b>JUMP</b><span>Pop off the ground. Hit a kicker for big air.</span>
   <b>FRONT FLIP</b><span>On the ground you tuck for speed. In the air you rotate forward.</span>
   <b>BACK FLIP</b><span>On the ground you brake. In the air you rotate backward.</span>
   <b>SPIN</b><span>Hold in the air to spin. Hold the steering pad left or right to pick the direction.</span>
   <b>GRAB</b><span>Hold in the air to grab the board for extra points.</span>
   <b>NITRO</b><span>Speed boost while the bar lasts. Tricks refill it.</span>
  </div></div>
  <div class="card muted">Land with your board close to the slope or you wipe out. Land almost flat and straight for a Perfect landing bonus. Chain tricks for a multiplier. Jump onto a rail or box to grind it. Land on top of a rock for a rock hop, but hit one from the side and you wipe out. Trees will stop you. In Missions you get a stream of tasks: finish them for RP and cash. Use the speaker button in the menu or pause screen to turn sound on or off.</div>
  <h3>Laptop keyboard</h3>
  <div class="card"><div class="keys">
   <b>← → or A D</b><span>Steer left and right.</span>
   <b>SPACE</b><span>Jump.</span>
   <b>↑ or W</b><span>Front flip in the air, tuck for speed on the ground.</span>
   <b>↓ or S</b><span>Back flip in the air, brake on the ground.</span>
   <b>E</b><span>Spin in the air. Hold ← or → to choose the direction.</span>
   <b>G</b><span>Grab the board in the air.</span>
   <b>SHIFT</b><span>Nitro boost.</span>
   <b>ESC</b><span>Pause.</span>
  </div></div>
  </div>`;},
 code(){return `<div class="wrap" style="max-width:640px"><div class="hdr"><button class="btn gh c" data-a="go" data-v="menu">‹ Back</button><h2>Save code</h2><span></span></div><h3>Save progress</h3><div class="card">${typeof claude==='undefined'?`<div class="nm" style="font:700 13px var(--display)">Saved on this device</div><div class="muted" style="font-size:13px;margin-top:6px">Your progress is saved automatically in this browser. To continue on another phone or computer, copy the backup code below and paste it there under Restore.</div></div>`:`<div class="nm" style="font:700 13px var(--display)">${esc(cloud.status)}</div><div class="muted" style="font-size:13px;margin-top:6px">Progress is always saved on this device. When you open the game while signed in to Claude, it is also synced to your account so it follows you between phones. Apple, Google or email sign-in is not possible in this version.</div></div>`}
   <h3>Backup code</h3><div class="muted" style="font-size:13px">Copy this code to move your progress to any iPhone, Android phone or browser. Paste it on the other device under Restore.</div><textarea class="inp" id="codeOut" rows="3" readonly>${saveCode()}</textarea><button class="btn c" data-a="copycode">Copy code</button>
   <h3>Restore</h3><textarea class="inp" id="codeIn" rows="3" placeholder="Paste a backup code here"></textarea><button class="btn pri c" data-a="restore">Restore from code</button><div class="muted" id="codeMsg" style="font-size:13px"></div></div>`;},
 pause(){const free=G&&(G.mode==='free'||G.mode==='task');return `${sndBtn()}<div class="wrap" style="justify-content:center;max-width:420px"><h2>Paused</h2>
  <div class="menu-btns" style="grid-template-columns:1fr">
   <button class="btn pri c" data-a="resume">Resume</button>
   ${free?'<button class="btn c" data-a="endFree">Finish run</button>':''}
   <button class="btn gh c" data-a="quit">Quit to menu</button></div></div>`;},
 result(){const r=G.res;return `<div class="wrap" style="justify-content:center;max-width:460px"><h2>${r.title}</h2>
  <div class="card"><div class="stats">${r.rows.map(x=>`<span>${x[0]}</span><b>${x[1]}</b>`).join('')}</div></div>
  ${r.rankUp?`<div class="up">RANK UP: ${RANKS[r.rankUp.nw].n}<span>Reward: + $${fmt(r.rankUp.bonus)}</span></div>`:''}
  <div class="menu-btns" style="grid-template-columns:1fr">
   <button class="btn pri c" data-a="again">Go again</button>
   <button class="btn c" data-a="go" data-v="shop">Shop</button>
   <button class="btn gh c" data-a="quit">Menu</button></div></div>`;}
};
function equipItem(cat,id){
 const sv=S.save;
 if(cat==='helmet'&&!fits(charOf(sv.eq.char),item('helmet',id)))return;
 sv.eq[cat]=id;
 if(cat==='char'&&!fits(charOf(id),item('helmet',sv.eq.helmet)))sv.eq.helmet='h0';
}
function drawPreviews(){
 E.scr.querySelectorAll('canvas.pv').forEach(cn=>{
  const k=cn.dataset.k,id=cn.dataset.id;
  try{
   if(k==='track')drawTrackPreview(cn,TRACKS.find(t=>t.id===id));
   else if(k==='costume')drawRiderPreview(cn,mkLook({ch:charOf(S.save.eq.char),costume:item('costume',id)}),-.95,id==='c13'?1:0.4);
   else if(k==='char'){const cc=charOf(id);drawRiderPreview(cn,{cp:true,ch:cc,costume:{kind:'plain',body:cc.jk,acc:'#ffffff',id:'cp'},board:item('board',S.save.eq.board),gog:item('goggles','g0'),hm:item('helmet','h0')},-.35,.5,{crouch:.1,arms:.25});}
   else if(k==='board')drawBoardPreview(cn,item('board',id));
   else if(k==='goggles')drawGogglesPreview(cn,item('goggles',id));
   else if(k==='helmet')drawHelmetPreview(cn,item('helmet',id));
  }catch(e){}
 });
}
let _pvLast=0;
function previewTick(ts){
 if(E.scr.hidden)return;
 const cn=document.getElementById('heroPv')||document.getElementById('lockPv');if(!cn)return;
 if(ts-_pvLast<33)return;_pvLast=ts;
 const lk=lookOf(S.save.eq);
 drawRiderPreview(cn,lk,-.95+Math.sin(ts*.0007)*.5,ts*.001,{crouch:.12+.04*Math.sin(ts*.002),arms:.3+.2*Math.sin(ts*.0015)});
}
function showScreen(n){S.cur=n;E.scr.hidden=false;E.scr.innerHTML=SCR[n]();E.scr.scrollTop=0;if(n!=='menu')drawPreviews();if(n==='setup'){const i=document.getElementById('nameIn');if(i)i.addEventListener('input',()=>{S.tmpName=i.value;});}
 if(n==='locker'){const i=document.getElementById('nameIn2');if(i)i.addEventListener('input',()=>{S.save.name=i.value.trim().slice(0,14);persist();});}}
function award(rp,coins){
 const sv=S.save,old=rankOf(sv.rp);
 sv.rp+=rp;sv.coins+=coins;
 const nw=rankOf(sv.rp);let bonus=0;
 for(let i=old+1;i<=nw;i++)bonus+=RANKS[i].coin;
 sv.coins+=bonus;persist();
 return nw>old?{old,nw,bonus}:null;
}
function showResult(g){
 E.hud.hidden=true;E.ctl.hidden=true;E.cd.textContent='';clearInput();
 const sv=S.save,best=sv.best[g.def.id]||(sv.best[g.def.id]={});
 let res;
 if(g.mode==='race'){
  const bonusRP=Math.floor(g.score/150),bonusC=Math.floor(g.score/60);
  const dm=g.dm||1,rp=Math.round((g.win?g.od.rp*dm:8)+bonusRP),coins=Math.round((g.win?g.od.coin*dm:20)+bonusC);
  let rec='';
  if(g.win&&(!best.t||g.time<best.t)){best.t=g.time;rec=' · NEW BEST';}
  res={title:g.win?'You won!':'You lost',rows:[['Opponent',g.od.n],['Mountain',g.def.n],['Time',fmtT(g.time)+rec],['Trick score',fmt(g.score)],['RP earned','+'+fmt(rp)],['Cash earned','+ $'+fmt(coins)]]};
  res.rankUp=award(rp,coins);
 }else if(g.mode==='task'){
  const rp=Math.floor(g.score/260),coins=Math.floor(g.score/120);
  let rec='';if(g.score>(best.s||0)){best.s=g.score;rec=' · NEW BEST';}
  const ru=award(rp,coins);
  const ru2=g.rankUp?(ru?{old:g.rankUp.old,nw:ru.nw,bonus:g.rankUp.bonus+ru.bonus}:g.rankUp):ru;
  res={title:'Mission run over',rows:[['Mountain',g.def.n],['Tasks completed',String(g.tasksDone||0)],['Task rewards','+'+fmt(g.taskRP||0)+' RP · + $'+fmt(g.taskCoin||0)],['Trick score',fmt(g.score)+rec],['Trick RP and cash','+'+fmt(rp)+' RP · + $'+fmt(coins)]]};
  res.rankUp=ru2;
 }else{
  const rp=Math.floor(g.score/130),coins=Math.floor(g.score/60);
  let rec='';if(g.score>(best.s||0)){best.s=g.score;rec=' · NEW BEST';}
  res={title:'Run complete',rows:[['Mountain',g.def.n],['Trick score',fmt(g.score)+rec],['Tricks landed',String(g.tricks)],['RP earned','+'+fmt(rp)],['Cash earned','+ $'+fmt(coins)]]};
  res.rankUp=award(rp,coins);
 }
 g.res=res;persist();showScreen('result');if(res.rankUp)setTimeout(()=>SFX.win(),250);
}
E.scr.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const a=b.dataset.a,v=b.dataset.v,sv=S.save;
 if(a==='snd'){SFX.unlock();SFX.toggle();b.classList.toggle('off',!SFX.on);b.setAttribute('aria-label','Sound '+(SFX.on?'on':'off'));return;}
 if(a!=='buy')SFX.click();
 if(a==='go')showScreen(v);
 else if(a==='track'){S.selT=+v;const sy=E.scr.scrollTop;showScreen(S.cur);E.scr.scrollTop=sy;}
 else if(a==='opp'){S.selO=+v;showScreen('race');}
 else if(a==='startRace')startGame('race',S.selT,S.selO);
 else if(a==='startFree')startGame('free',S.selT,0);
 else if(a==='startTask')startGame('task',S.selT,0);
 else if(a==='char'){S.tmpChar=v;const sy=E.scr.scrollTop;showScreen('setup');E.scr.scrollTop=sy;}
 else if(a==='copycode'){const t=document.getElementById('codeOut');t.select();try{navigator.clipboard.writeText(t.value);}catch(e){}try{document.execCommand('copy');}catch(e){}const mg=document.getElementById('codeMsg');if(mg)mg.textContent='Code copied.';}
 else if(a==='restore'){const ok=restoreCode(document.getElementById('codeIn').value);const mg=document.getElementById('codeMsg');if(ok){showScreen('menu');}else if(mg)mg.textContent='That code is not valid.';}
 else if(a==='restore0'){const ok=restoreCode(document.getElementById('codeIn0').value);const mg=document.getElementById('codeMsg0');if(ok)showScreen('menu');else if(mg)mg.textContent='That code is not valid.';}
 else if(a==='savecode')showScreen('code');
 else if(a==='lk'){S.lk=v;showScreen('locker');}
 else if(a==='eq2'){if(sv.own[b.dataset.c].includes(v)){equipItem(b.dataset.c,v);persist();const sy=E.scr.scrollTop;showScreen('locker');E.scr.scrollTop=sy;}}
 else if(a==='setupGo'){const nm=(S.tmpName||'').trim().slice(0,14)||'Rider';sv.name=nm;const cid=S.tmpChar||'kai';sv.own.char=[cid];sv.eq.char=cid;persist();showScreen('menu');}
 else if(a==='tab'){S.tab=v;showScreen('shop');}
 else if(a==='buy'){
  if(S.tab==='track'){const t=TRACKS.find(x=>x.id===v);if(t&&sv.coins>=t.price&&rankOf(sv.rp)>=t.rank&&!sv.own.track.includes(v)){sv.coins-=t.price;sv.own.track.push(v);persist();SFX.coin();showScreen('shop');}}
  else{const it=item(S.tab,v);if(it&&sv.coins>=it.price&&rankOf(sv.rp)>=it.rank&&!sv.own[S.tab].includes(v)){sv.coins-=it.price;sv.own[S.tab].push(v);equipItem(S.tab,v);persist();SFX.coin();showScreen('shop');}}
 }
 else if(a==='equip'){if(sv.own[S.tab].includes(v)){equipItem(S.tab,v);persist();showScreen('shop');}}
 else if(a==='resume')resumeGame();
 else if(a==='endFree'){E.scr.hidden=true;G.state='finish';G.fd=.01;}
 else if(a==='quit')toMenu();
 else if(a==='again'){startGame(G.mode,S.selT,S.selO);}
});
resize();startDemo();showScreen(S.save.name?'menu':'setup');cloudInit();requestAnimationFrame(frame);
/*MENUS_END*/
})();

</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
